<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flipkart Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="logo">Flipkart</div>
    <input class="search-bar" type="text" placeholder="Search for products" />
    <nav class="header-nav">
      <a href="#">Login</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <!-- Category Bar -->
  <section class="category-bar">
    <a href="#">Mobiles</a>
    <a href="#">Fashion</a>
    <a href="#">Electronics</a>
    <a href="#">Home</a>
    <a href="#">Grocery</a>
    <a href="#">Appliances</a>
  </section>

  <!-- Product Section -->
  <section class="product-section">
    <h2 class="section-title">Top Deals</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="PHONE_PNG.png" alt="Product">
        <h3>Smartphone</h3>
        <p class="price">₹62,999</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="shirt.png" alt="Product">
        <h3>Shirt</h3>
        <p class="price">₹18,499</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="Shoes-PNG.png" alt="Product">
        <h3>Shoes</h3>
        <p class="price">₹29,299</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="laptop.png" alt="Product">
        <h3>Laptop</h3>
        <p class="price">₹169,999</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="main-footer">
    <p>© 2025 Flipkart Clone. Made by souvik.</p>
  </footer>

</body>
</html>
